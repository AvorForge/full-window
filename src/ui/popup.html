<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%BRAND_NAME%</title>
    <!-- Fetched with the stylesheet, so the first paint already has it (no font change while the popup opens). -->
    <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 320px;
      }
      main {
        display: grid;
        gap: 18px;
        padding: 18px 16px 16px;
      }
      #site {
        overflow-wrap: anywhere;
      }
      #state {
        margin-top: 3px;
      }
      #site-controls {
        display: grid;
        gap: 16px;
      }
      footer {
        border-top: 0.5px solid var(--line);
        padding-top: 14px;
        display: grid;
        gap: 12px;
      }
      footer .row {
        gap: 8px;
      }
      #open-options {
        margin-left: auto;
      }
      /* Three options in 288 px: a little smaller than on the options page. */
      .segmented {
        margin: 0 -1px;
      }
      .segmented label {
        font-size: 11px;
        letter-spacing: 0.06px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="row">
        <div>
          <h1 id="site">Loading…</h1>
          <p id="state" class="small muted" hidden></p>
        </div>
        <input id="site-enabled" class="switch" type="checkbox" role="switch" hidden />
      </div>

      <div id="site-controls" hidden>
        <fieldset>
          <legend class="small muted">Size</legend>
          <div class="segmented">
            <label><input type="radio" name="site-mode" value="fill-tab" />Fill tab</label>
            <label><input type="radio" name="site-mode" value="custom-rect" />Custom size</label>
            <label><input type="radio" name="site-mode" value="pop-out" />Pop out</label>
          </div>
        </fieldset>

        <div id="rect-size" class="pair" hidden>
          <div class="field">
            <label for="rect-width" class="small muted">Width</label>
            <div class="length">
              <input id="rect-width" type="number" min="1" step="1" inputmode="numeric" />
              <span class="popup-select">
                <select id="rect-width-unit" aria-label="Width unit">
                  <option value="%">%</option>
                  <option value="px">px</option>
                </select>
                <svg aria-hidden="true" width="10" height="12" viewBox="0 0 10 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 4 2-2 2 2M3 8l2 2 2-2" /></svg>
              </span>
            </div>
          </div>
          <div class="field">
            <label for="rect-height" class="small muted">Height</label>
            <div class="length">
              <input id="rect-height" type="number" min="1" step="1" inputmode="numeric" />
              <span class="popup-select">
                <select id="rect-height-unit" aria-label="Height unit">
                  <option value="%">%</option>
                  <option value="px">px</option>
                </select>
                <svg aria-hidden="true" width="10" height="12" viewBox="0 0 10 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 4 2-2 2 2M3 8l2 2 2-2" /></svg>
              </span>
            </div>
          </div>
          <div class="field">
            <label for="rect-anchor" class="small muted">Anchor</label>
            <span class="popup-select">
              <select id="rect-anchor"></select>
              <svg aria-hidden="true" width="10" height="12" viewBox="0 0 10 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 4 2-2 2 2M3 8l2 2 2-2" /></svg>
            </span>
          </div>
        </div>

        <div id="window-size" class="pair" hidden>
          <div class="field">
            <label for="window-width" class="small muted">Window width (px)</label>
            <input id="window-width" type="number" min="100" max="16384" step="1" inputmode="numeric" />
          </div>
          <div class="field">
            <label for="window-height" class="small muted">Window height (px)</label>
            <input id="window-height" type="number" min="100" max="16384" step="1" inputmode="numeric" />
          </div>
        </div>
      </div>

      <footer>
        <p id="shortcut" class="small muted"></p>
        <div class="row">
          <button id="clear-site" class="link" type="button" hidden>Reset this site</button>
          <button id="open-options" class="link" type="button">Settings</button>
        </div>
      </footer>
      <span id="status" class="visually-hidden" role="status"></span>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
