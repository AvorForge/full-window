<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- poppedOut.js sets "Popped out: <page title>" from the URL's query. -->
    <title>%BRAND_NAME%</title>
    <!-- Local files only: the placeholder loads nothing from the network (no remote favicon either). -->
    <link rel="icon" href="../icons/icon-32.png" />
    <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="poppedOut.css" />
  </head>
  <body>
    <main>
      <img src="../icons/icon-128.png" width="64" height="64" alt="" />
      <h1>This video is in its own window</h1>
      <button id="bring-back" type="button">Bring it back</button>
    </main>
    <script src="poppedOut.js"></script>
  </body>
</html>
